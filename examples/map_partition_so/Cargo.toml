[package]
name = "map-partition-so"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "test_map_partition"
path = "examples/test_map_partition.rs"

[[example]]
name = "distributed_compute"
path = "examples/distributed_compute.rs"

[[example]]
name = "so_compute"
path = "examples/so_compute.rs"

[dependencies]
datafusion = { path = "../../datafusion/core" }
arrow = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
futures = "0.3"
futures-util = "0.3"